name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'
      SERVERPOD_PASSWORD_database: '0eKmyKypkp3FxNDUUXo2u24DPYtmrhgY'
      SERVERPOD_PASSWORD_redis: 'KhITCMIuFtkuLJ_imJI292jqTwuaXAwC'
      # Throwaway values for test runs only. The demo seed test signs accounts
      # in for real, so the auth services need their secrets here, as
      # config/passwords.yaml (not in git) gives them locally.
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'S_rUWDNXs0Voc_YTLbBHd2BFqNkgSn8U'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'IqWIRtiRA1QY8h-ppSzWqHMgh5KT3uLh'
      SERVERPOD_PASSWORD_emailSecretHashPepper: 'W3-yjC5zLi__CLITnGuiAfzjBRU1jkc0'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: chorus_server
        run: serverpod generate

      - name: Run tests
        working-directory: chorus_server
        run: dart test
