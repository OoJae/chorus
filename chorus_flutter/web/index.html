<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A talking picture board that a child's whole circle keeps in step, and that still speaks with no signal.">
  <meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons. The touch icon is opaque: iOS turns see-through
       corners black. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chorus">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chorus</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The landing page at / cross-fades into the app where the browser
       supports cross-document view transitions. */
    @view-transition { navigation: auto; }

    /* Shown until the app's first frame, so a slow connection is not a blank
       page: the mark on card (slate in dark mode), its four tiles rising one
       after another like voices joining, and the name under it. Fraunces is
       not loaded yet, so the name falls back to the system serif. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #15171A; background: #F6F2EA;
      --action: #C7EFB2; --action-edge: #7DB863;
      --person: #FFEFA0; --person-edge: #D6B53F;
      --describe: #C0DBFF; --describe-edge: #6E9FE0;
      --question: #DDCBFF; --question-edge: #9B7BDF;
      --muted: #5A5F67;
    }
    #loading svg { width: 72px; height: 72px; overflow: visible; }
    #loading .tile rect { fill: var(--edge); }
    #loading .tile rect + rect { fill: var(--face); }
    #loading .tile { animation: chorus-rise 1.6s cubic-bezier(.65, 0, .35, 1) infinite; }
    #loading .tile:nth-child(2) { animation-delay: .15s; }
    #loading .tile:nth-child(3) { animation-delay: .3s; }
    #loading .tile:nth-child(4) { animation-delay: .45s; }
    @keyframes chorus-rise { 0%, 50%, 100% { transform: translateY(0); } 25% { transform: translateY(-4px); } }
    #loading .name {
      font: 600 34px/1 Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      letter-spacing: -0.02em;
    }
    /* Filled in only when loading is slow. It takes no room of its own, so the
       mark and the name do not jump when the words appear. */
    #loading .slow {
      height: 0; padding: 0 24px; text-align: center;
      font: 400 16px system-ui, sans-serif; color: var(--muted);
    }
    #loading .slow.shown { animation: chorus-appear .4s ease-out; }
    @keyframes chorus-appear { from { opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      #loading {
        color: #EEE9E0; background: #101214;
        --action: #A9D993; --action-edge: #5F9A48;
        --person: #E7D57D; --person-edge: #B0942D;
        --describe: #9DC2F1; --describe-edge: #4F7EBF;
        --question: #C1AEEF; --question-edge: #7A5BC1;
        --muted: #A4A8AF;
      }
    }
    @media (prefers-reduced-motion: reduce) { #loading .tile, #loading .slow.shown { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <!-- The mark, as in docs/brand/mark.svg: each tile is its edge colour
         with the face 3 units shorter on top. -->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g class="tile" style="--face: var(--action); --edge: var(--action-edge)">
        <rect x="3" y="1.5" width="25" height="25" rx="6"/><rect x="3" y="1.5" width="25" height="22" rx="6"/>
      </g>
      <g class="tile" style="--face: var(--person); --edge: var(--person-edge)">
        <rect x="36" y="4.5" width="25" height="25" rx="6"/><rect x="36" y="4.5" width="25" height="22" rx="6"/>
      </g>
      <g class="tile" style="--face: var(--describe); --edge: var(--describe-edge)">
        <rect x="3" y="37.5" width="25" height="25" rx="6"/><rect x="3" y="37.5" width="25" height="22" rx="6"/>
      </g>
      <g class="tile" style="--face: var(--question); --edge: var(--question-edge)">
        <rect x="36" y="37.5" width="25" height="25" rx="6"/><rect x="36" y="37.5" width="25" height="22" rx="6"/>
      </g>
    </svg>
    <span class="name">chorus</span>
    <span class="slow"></span>
  </div>
  <script>
    // A first visit on a slow connection can take many seconds. After four,
    // say so in words, so the moving tiles are not mistaken for a page that
    // is stuck.
    var slowTimer = setTimeout(function () {
      var slow = document.querySelector('#loading .slow');
      if (!slow) return;
      slow.textContent = 'Loading. The first visit takes a little longer.';
      slow.classList.add('shown');
    }, 4000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowTimer);
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
