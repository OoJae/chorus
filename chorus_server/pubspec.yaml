name: chorus_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  # The rules shared with the app: summaries, symbols, the .obf format. A
  # workspace package, so `scloud deploy` uploads it with the server.
  chorus_shared:
    path: ../chorus_shared
  # Hashing uploaded media. Already resolved in the workspace at 3.0.7.
  crypto: ^3.0.7
  # The suggestion service is called over plain HTTPS. Resolved at 1.6.0.
  http: ^1.6.0
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage: 4.0.4
  # Exact pin: 0.0.11 needs a Serverpod 4.1 beta. Do not upgrade mid-build.
  serverpod_offline_sync_server: 0.0.10

dev_dependencies:
  chorus_client:
    path: ../chorus_client
  lints: '>=3.0.0 <7.0.0'
  path: ^1.9.1
  serverpod_database: 4.0.4
  serverpod_offline_sync_client: 0.0.10
  serverpod_test: 4.0.4
  test: ^1.25.5
  uuid: ^4.5.3

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\chorus_flutter
        & set ARGS=web --base-href /app/
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\chorus_server\web\app
      posix: |
        rm -rf ../chorus_server/web/app
        cd ../chorus_flutter
        set -- web --base-href /app/ --output ../chorus_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    chorus:
      path: ../chorus_flutter
      displayName: "Chorus app"
      auto_launch: true
      target: lib/driver.dart
