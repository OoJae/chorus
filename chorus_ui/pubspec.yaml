name: chorus_ui
description: Chorus screens, written against contracts so they run on in-memory fakes.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  chorus_shared:
    path: ../chorus_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/symbols/
    # The ready-made boards, as Open Board Format files.
    - assets/boards/
  # Bundled so the app's type works offline. All three are under the SIL
  # Open Font License; the texts are next to the fonts. The app refers to
  # them as packages/chorus_ui/<family>, through ChorusType.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
